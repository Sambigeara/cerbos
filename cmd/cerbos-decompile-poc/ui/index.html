<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cerbos rule-table editor (POC)</title>
<style>
  :root { --bg:#ffffff; --panel:#f6f8fa; --line:#d0d7de; --fg:#1f2328; --muted:#656d76; --accent:#0969da; --allow:#1a7f37; --deny:#cf222e; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; background:var(--bg); color:var(--fg); height:100vh; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:12px; padding:10px 16px; border-bottom:1px solid var(--line); }
  header h1 { font-size:15px; margin:0; font-weight:600; }
  #error { display:none; margin-left:auto; max-width:60%; color:var(--deny); white-space:pre-wrap; font-size:12px; }
  main { display:flex; flex:1; min-height:0; }
  .pane { flex:1; min-width:0; display:flex; flex-direction:column; border-right:1px solid var(--line); }
  .pane:last-child { border-right:none; }
  .pane h2 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:0; padding:8px 16px; border-bottom:1px solid var(--line); display:flex; align-items:center; }
  .pane h2 button { margin-left:auto; font:inherit; font-size:12px; color:var(--bg); background:var(--accent); border:0; border-radius:4px; padding:4px 12px; cursor:pointer; }
  textarea { flex:1; resize:none; border:0; outline:none; background:var(--panel); color:var(--fg); padding:12px 16px; font:inherit; tab-size:2; }
  .grid-wrap { flex:1; overflow:auto; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:6px 12px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { position:sticky; top:0; background:var(--panel); color:var(--muted); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.05em; }
  td.edit { cursor:pointer; }
  td.edit:hover { background:var(--line); }
  .pill { padding:1px 8px; border-radius:10px; font-size:12px; }
  .allow { color:var(--allow); border:1px solid var(--allow); }
  .deny { color:var(--deny); border:1px solid var(--deny); }
  .muted { color:var(--muted); }
  td select { font:inherit; font-size:13px; background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:4px; padding:1px 4px; cursor:pointer; }
  td.del { cursor:pointer; color:var(--muted); text-align:center; width:1px; }
  td.del:hover { color:var(--deny); }
  tr.add td { padding:4px 12px; }
  tr.add button { font:inherit; font-size:12px; color:var(--accent); background:none; border:1px dashed var(--line); border-radius:4px; padding:2px 10px; cursor:pointer; }
</style>
</head>
<body>
<header>
  <h1>Cerbos rule-table editor</h1>
  <span id="error"></span>
</header>
<main>
  <section class="pane">
    <h2>YAML <button id="apply">Apply</button></h2>
    <textarea id="yaml" spellcheck="false"></textarea>
  </section>
  <section class="pane">
    <h2>Grid</h2>
    <div class="grid-wrap">
      <table>
        <thead><tr><th>kind</th><th>resource/principal</th><th>scope</th><th>action</th><th>role</th><th>effect</th><th>condition</th><th></th></tr></thead>
        <tbody id="grid-body"></tbody>
      </table>
    </div>
  </section>
</main>
<script>
let state = { rev: 0, yaml: "", grid: [], error: "" };

function showError(msg) {
  const el = document.getElementById("error");
  el.textContent = msg || "";
  el.style.display = msg ? "block" : "none";
}

function td(text, cls) {
  const c = document.createElement("td");
  if (cls) c.className = cls;
  c.textContent = text || "";
  return c;
}

function editCell(displayText, apply, editText) {
  const c = td(displayText || "—", "edit");
  c.onclick = () => {
    const next = prompt("Edit value", editText !== undefined ? editText : displayText);
    if (next !== null) apply(next);
  };
  return c;
}

function effectCell(row) {
  if (row.Effect !== "EFFECT_ALLOW" && row.Effect !== "EFFECT_DENY") return td("allow", "muted");
  const c = td("", "edit");
  const pill = document.createElement("span");
  const allow = row.Effect === "EFFECT_ALLOW";
  pill.className = "pill " + (allow ? "allow" : "deny");
  pill.textContent = allow ? "ALLOW" : "DENY";
  c.appendChild(pill);
  c.onclick = () => patchRow(row.Key, { Effect: allow ? "EFFECT_DENY" : "EFFECT_ALLOW" });
  return c;
}

function roleCell(row) {
  if (row.DerivedRole) return editCell(row.DerivedRole + " (derived)", v => patchRow(row.Key, { DerivedRole: v }), row.DerivedRole);
  if (row.PolicyKind === "principal") return td("", "muted"); // principal rules have no role axis
  return editCell(row.Role, v => patchRow(row.Key, { Role: v }));
}

function kindCell(row) {
  const c = document.createElement("td");
  const sel = document.createElement("select");
  for (const k of ["resource", "principal", "role"]) {
    const o = document.createElement("option");
    o.value = k;
    o.textContent = k;
    o.selected = k === row.PolicyKind;
    sel.appendChild(o);
  }
  sel.onchange = () => setKind(row.PolicyFQN, sel.value);
  c.appendChild(sel);
  return c;
}

function renderRow(row) {
  const tr = document.createElement("tr");
  tr.appendChild(kindCell(row));
  tr.appendChild(editCell(row.Resource || row.Principal, v => patchRow(row.Key, { Resource: v })));
  tr.appendChild(editCell(row.Scope, v => patchRow(row.Key, { Scope: v })));
  tr.appendChild(editCell(row.Action, v => patchRow(row.Key, { Action: v })));
  tr.appendChild(roleCell(row));
  tr.appendChild(effectCell(row));
  tr.appendChild(editCell(row.Condition, v => patchRow(row.Key, { Condition: v }), row.Condition === "<matcher>" ? "" : row.Condition));

  const del = td("✕", "del");
  del.title = "Delete row";
  del.onclick = () => deleteRow(row.Key);
  tr.appendChild(del);
  return tr;
}

function addLine(label, cls, onClick) {
  const tr = document.createElement("tr");
  tr.className = cls;
  const cell = document.createElement("td");
  cell.colSpan = 8;
  const btn = document.createElement("button");
  btn.textContent = label;
  btn.onclick = onClick;
  cell.appendChild(btn);
  tr.appendChild(cell);
  return tr;
}

function render() {
  showError(state.error);
  const ta = document.getElementById("yaml");
  if (document.activeElement !== ta) ta.value = state.yaml;

  const body = document.getElementById("grid-body");
  body.replaceChildren();

  const groups = [];
  for (const row of state.grid || []) {
    let g = groups[groups.length - 1];
    if (!g || g.fqn !== row.PolicyFQN) { g = { fqn: row.PolicyFQN, rows: [] }; groups.push(g); }
    g.rows.push(row);
  }
  for (const g of groups) {
    for (const row of g.rows) body.appendChild(renderRow(row));
  }
  body.appendChild(addLine("+ row", "add", addPolicy));
}

async function refresh() {
  const r = await fetch("/api/state");
  state = await r.json();
  render();
}

async function applyYAML() {
  const r = await fetch("/api/yaml", { method: "POST", body: document.getElementById("yaml").value });
  if (!r.ok) { showError(await r.text()); return; }
  state = await r.json();
  render();
}

async function post(url, payload) {
  const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
  if (!r.ok) { showError(await r.text()); return false; }
  state = await r.json();
  render();
  return true;
}

async function patchRow(key, patch) { await post("/api/row", { key, patch }); }
async function deleteRow(key) { await post("/api/row/delete", { key }); }

async function addPolicy() { await post("/api/policy/add", { kind: "resource" }); }
async function setKind(fqn, kind) { await post("/api/policy/kind", { fqn, kind }); }

document.getElementById("apply").onclick = applyYAML;

const es = new EventSource("/events");
es.onmessage = (e) => {
  const data = JSON.parse(e.data);
  if (data.rev !== state.rev) refresh();
};

refresh();
</script>
</body>
</html>
